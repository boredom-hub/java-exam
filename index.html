  document.getElementById('tabs').innerHTML = [
    ['exam3','Exam 3 (Purpose)'],['exam4','Exam 4 (Code Trace)'],['mixed','Mixed (100)']
  ].map(([k,l])=>`<div class="tab ${k===examKey?'active':''}" onclick="loadExam('${k}')">${l}</div>`).join('');
}

function renderQ(){
  const card = document.getElementById('card');
  if(cur >= deck.length){
    card.innerHTML = `<div class="done"><h2>Done!</h2><p>Score: ${score} / ${deck.length}</p>
      <button class="next" onclick="loadExam(examKey)">Restart</button></div>`;
    return;
  }
  const item = deck[cur];
  const letters = ['A','B','C','D'];
  card.innerHTML = `
    <div class="prog">Question ${cur+1} of ${deck.length}</div>
    <div class="qtext">${fmt(item.q)}</div>
    <div id="choices">${item.c.map((c,i)=>`<button class="choice" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${fmt(c)}</button>`).join('')}</div>
    <div id="explainBox"></div>
    <div class="foot"><span class="score">Score: ${score}/${cur}</span><button class="next" id="nextBtn" disabled onclick="cur++;renderQ()">Next →</button></div>
  `;
}

function pick(i){
  const item = deck[cur];
  const choicesDiv = document.getElementById('choices');
  choicesDiv.classList.add('locked');
  const btns = choicesDiv.querySelectorAll('.choice');
  btns.forEach(b=>b.onclick=null);
  btns[item.a].classList.add('correct');
  let expl;
  if(i === item.a){
    score++;
    expl = `<div class="explain ok"><b>✓ Correct.</b> ${fmt(item.c[item.a])} — this directly matches the concept being tested. The other options describe behavior, syntax, or effects that don't apply to this line/keyword.</div>`;
  } else {
    btns[i].classList.add('wrong');
    expl = `<div class="explain no"><b>✗ Not quite.</b> The correct answer is <b>${['A','B','C','D'][item.a]}</b>: ${fmt(item.c[item.a])}. Your pick described something the code doesn't actually do here — the other non-correct options are similarly off (wrong role, wrong timing, or a made-up effect).</div>`;
  }
  document.getElementById('explainBox').innerHTML = expl;
  document.getElementById('nextBtn').disabled = false;
}

loadExam('exam3');
</script>
</body></html>
